name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4

      - name: Check source
        run: mise run check

      - name: Build archives and checksums
        env:
          VITE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: mise run dist -- "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ryudai-tools_"${GITHUB_REF_NAME}"_* dist/checksums.txt \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
